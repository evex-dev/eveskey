name: Sync upstream release

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest upstream release
        id: upstream
        run: |
          tag=$(gh release view --repo misskey-dev/misskey --json tagName --jq '.tagName')
          echo "tag=$tag" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Check if branch already exists
        id: check
        run: |
          if git ls-remote --exit-code origin "refs/heads/upstream/${{ steps.upstream.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup git
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git remote add upstream https://github.com/misskey-dev/misskey.git
          git fetch upstream tag "${{ steps.upstream.outputs.tag }}" --no-tags
          if ! git rev-parse "refs/tags/${{ steps.upstream.outputs.tag }}" > /dev/null 2>&1; then
            echo "::error::Tag ${{ steps.upstream.outputs.tag }} was not found after fetching upstream."
            exit 1
          fi

      - name: Create and push branch
        if: steps.check.outputs.exists == 'false'
        run: |
          git checkout -b "upstream/${{ steps.upstream.outputs.tag }}" "refs/tags/${{ steps.upstream.outputs.tag }}"
          git push origin "upstream/${{ steps.upstream.outputs.tag }}"

      - name: Create PR
        if: steps.check.outputs.exists == 'false'
        run: |
          body=$(gh release view "${{ steps.upstream.outputs.tag }}" --repo misskey-dev/misskey --json body --jq '.body')
          if [ -z "$body" ]; then
            body="Sync upstream release: ${{ steps.upstream.outputs.tag }}"
          fi
          printf '%s' "$body" > /tmp/pr-body.txt
          gh pr create \
            --title "upstream: ${{ steps.upstream.outputs.tag }}" \
            --body-file /tmp/pr-body.txt \
            --head "upstream/${{ steps.upstream.outputs.tag }}" \
            --base develop
        env:
          GH_TOKEN: ${{ github.token }}
